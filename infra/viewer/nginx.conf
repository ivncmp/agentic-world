# The viewer is served same-origin with the engine behind it, so the browser
# never needs to know the engine's address and there is no CORS to arrange.
# `location =` is an exact match: it cannot swallow a bundled asset the way a
# prefix rule would (a plain `/world` also matches `/world-scene.js`).

upstream engine {
  server engine:7070;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed bundles are immutable; index.html must never be cached or a deploy
  # keeps serving the old app that points at the old asset names.
  location = /index.html {
    add_header Cache-Control "no-store";
  }
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /world  { proxy_pass http://engine; include /etc/nginx/api_proxy.conf; }
  location = /agent  { proxy_pass http://engine; include /etc/nginx/api_proxy.conf; }
  location = /state  { proxy_pass http://engine; include /etc/nginx/api_proxy.conf; }
  location = /health { proxy_pass http://engine; include /etc/nginx/api_proxy.conf; }

  # The live feed. Without the upgrade headers nginx downgrades this to a plain
  # request and the socket closes immediately, which the client reads as a dead
  # engine and retries forever.
  location = /live {
    proxy_pass http://engine;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    # A quiet world can go minutes without an event; the default 60s would drop
    # the socket mid-simulation.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
