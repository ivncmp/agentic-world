<!doctype html>
<meta charset="utf-8">
<title>Agentic World</title>
<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<link rel="shortcut icon" href="/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
<link rel="manifest" href="/favicon/site.webmanifest">
<meta name="theme-color" content="#0a0e17">
<style>
  :root {
    --bg: #0a0e17;
    --panel: #111827;
    --fg: #e5e7eb;
    --dim: #6b7280;
    --line: #1f2937;
    --accent: #7dd3fc;
    --scene: #e879f9;
    --crisis: #fb923c;
    --diary: #60a5fa;
    --delib: #38bdf8;
    --error: #f87171;
    --ctrl-bg: #0f172ad9;
    --ctrl-btn: #1e293b;
    --ctrl-border: #2b3a52;
    --ctrl-hover: #334155;
    --ctrl-fg-hover: #fff;
    --phase-bg: rgba(125,211,252,0.1);
    --conn-on-bg: #14301f; --conn-on-fg: #4ade80;
    --conn-off-bg: #3a1a1a; --conn-off-fg: #f87171;
    --tab-hover: #1e293b;
    --tab-active-bg: #1e293b; --tab-active-fg: #fff;
    --row-hover: #1e293b;
    --ev-bg: #0d1117; --ev-hover: #151d2b;
    --thought-bg: #1a1f2e; --thought-fg: #cbd5e1;
    --xfer: #fbbf24;
    --gossip: #a78bfa;
    --tag-bg: #1e293b;
    --subtle: #94a3b8;
    --text: #cbd5e1;
    --warn-fg: #fbbf24;
    --track-bg: #1e293b;
    --fill-pos: #38bdf8; --fill-neg: #fb7185;
    --up: #4ade80; --down: #f87171;
    --venue-bg: #0f172afa;
    --venue-hover: #1e293b;
    --venue-shadow: rgba(0,0,0,.35);
    --neg: #f87171;
    --cog-calls: #4ade80; --cog-pending: #fbbf24; --cog-dropped: #f87171;
    --cog-tokens: #94a3b8; --cog-cost: #7dd3fc;
    --constraint: #fbbf24;
    --diary-text: #cbd5e1;
    --canvas-bg: #0f172a;
    --tooltip-bg: #0b1220;
    --tooltip-border: #2b3a52;
    --tooltip-fg: #e8edf5;
    --badge-bg: #1e293b;
    --badge-fg: #ffffff;
    --sidebar-w: 420px;
  }

  [data-theme="light"] {
    --bg: #f1f5f9;
    --panel: #ffffff;
    --fg: #1e293b;
    --dim: #64748b;
    --line: #e2e8f0;
    --accent: #0284c7;
    --scene: #a855f7;
    --crisis: #ea580c;
    --diary: #2563eb;
    --delib: #0ea5e9;
    --error: #dc2626;
    --ctrl-bg: #ffffffd9;
    --ctrl-btn: #f1f5f9;
    --ctrl-border: #cbd5e1;
    --ctrl-hover: #e2e8f0;
    --ctrl-fg-hover: #0f172a;
    --phase-bg: rgba(2,132,199,0.08);
    --conn-on-bg: #dcfce7; --conn-on-fg: #16a34a;
    --conn-off-bg: #fee2e2; --conn-off-fg: #dc2626;
    --tab-hover: #f1f5f9;
    --tab-active-bg: #e2e8f0; --tab-active-fg: #0f172a;
    --row-hover: #f1f5f9;
    --ev-bg: #f8fafc; --ev-hover: #f1f5f9;
    --thought-bg: #e2e8f0; --thought-fg: #334155;
    --xfer: #b45309;
    --gossip: #7c3aed;
    --tag-bg: #e2e8f0;
    --subtle: #475569;
    --text: #334155;
    --warn-fg: #d97706;
    --track-bg: #cbd5e1;
    --fill-pos: #0284c7; --fill-neg: #e11d48;
    --up: #16a34a; --down: #dc2626;
    --venue-bg: #fffffffa;
    --venue-hover: #f1f5f9;
    --venue-shadow: rgba(0,0,0,.08);
    --neg: #dc2626;
    --cog-calls: #16a34a; --cog-pending: #b45309; --cog-dropped: #dc2626;
    --cog-tokens: #64748b; --cog-cost: #0284c7;
    --constraint: #b45309;
    --diary-text: #334155;
    --canvas-bg: #dde4ed;
    --tooltip-bg: #ffffff;
    --tooltip-border: #cbd5e1;
    --tooltip-fg: #1e293b;
    --badge-bg: #ffffff;
    --badge-fg: #1e293b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { height: 100%; overflow: hidden }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 'Inter', ui-sans-serif, system-ui, sans-serif;
    display: flex;
  }
  #game-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #game-container canvas { display: block }

  #controls {
    position: absolute; left: 14px; bottom: 14px; z-index: 10;
    display: flex; gap: 6px; align-items: center;
    background: var(--ctrl-bg); border: 1px solid var(--line); border-radius: 10px;
    padding: 6px; backdrop-filter: blur(6px);
  }
  #controls button {
    width: 30px; height: 30px; border-radius: 7px; cursor: pointer;
    background: var(--ctrl-btn); color: var(--fg); border: 1px solid var(--ctrl-border);
    font-size: 14px; line-height: 1; display: grid; place-items: center;
    font-family: inherit;
  }
  #controls button:hover { background: var(--ctrl-hover); color: var(--ctrl-fg-hover) }
  #controls .sep { width: 1px; height: 20px; background: var(--line) }
  #controls .hint { color: var(--dim); font-size: 11px; padding: 0 6px }

  /* ---- sidebar shell ---- */

  #sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-logo {
    padding: 10px 16px 6px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .sidebar-logo img { width: 200px; height: auto }
  .city-name {
    font-size: 13px; font-weight: 600; letter-spacing: .04em;
    color: var(--dim);
  }
  .sidebar-header {
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 4px 12px;
  }
  .sidebar-header .clock { grid-row: 1 / 3 }
  .sidebar-header .date { grid-column: 2 }
  .sidebar-header .conn { grid-row: 1; grid-column: 3 }
  .sidebar-header .phase { grid-column: 2 / 4; white-space: nowrap }
  .clock { font-size: 22px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums }
  .date { color: var(--dim); font-size: 11px }
  .phase {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    background: var(--phase-bg); color: var(--accent);
  }
  .conn {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    margin-left: auto;
  }
  .conn.on { background: var(--conn-on-bg); color: var(--conn-on-fg) }
  .conn.off { background: var(--conn-off-bg); color: var(--conn-off-fg) }

  /* ---- theme toggle ---- */

  .theme-toggle {
    position: absolute; right: 14px; bottom: 14px; z-index: 10;
    width: 32px; height: 32px; border-radius: 8px; cursor: pointer;
    background: var(--ctrl-bg); border: 1px solid var(--line);
    color: var(--dim); font-size: 16px; line-height: 1;
    display: grid; place-items: center;
    backdrop-filter: blur(6px);
  }
  .theme-toggle:hover { background: var(--ctrl-hover); color: var(--ctrl-fg-hover) }

  /* ---- tabs ---- */

  .tab-bar {
    display: flex;
    padding: 6px 12px;
    gap: 4px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .tab-btn {
    flex: 1;
    padding: 6px 0;
    border: none;
    border-radius: 6px;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    position: relative;
    transition: background .15s, color .15s;
  }
  .tab-btn:hover { background: var(--tab-hover); color: var(--fg) }
  .tab-btn.active { background: var(--tab-active-bg); color: var(--tab-active-fg) }
  .tab-badge {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--scene);
    margin-left: 4px;
    vertical-align: middle;
  }

  .tab-content {
    flex: 1;
    overflow: hidden;
    display: flex;
    position: relative;
  }
  .tab-pane {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    display: none;
    flex-direction: column;
  }
  .tab-pane.active { display: flex }

  /* ---- town tab: roster ---- */

  .agents-list { padding: 6px 12px }
  .agent-row {
    padding: 5px 4px;
    border-radius: 6px;
    cursor: pointer;
    transition: background .1s;
  }
  .agent-row:hover { background: var(--row-hover) }
  .agent-row-top {
    display: flex; align-items: center; gap: 6px;
  }
  .agent-row-name { font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .agent-row-money { font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap }
  .agent-row-bottom {
    display: flex; gap: 8px; padding-left: 32px; margin-top: 1px;
    font-size: 11px; color: var(--dim);
  }
  .agent-row-state { white-space: nowrap }
  .agent-row-where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .neg { color: var(--neg) }

  /* ---- feed tab ---- */

  .feed { padding: 8px 12px; display: flex; flex-direction: column; gap: 6px }
  .ev {
    border-left: 3px solid var(--line);
    padding: 6px 10px;
    border-radius: 0 6px 6px 0;
    background: var(--ev-bg);
    transition: background .1s;
  }
  .ev:hover { background: var(--ev-hover) }
  .ev.scene { border-left-color: var(--scene) }
  .ev.diary { border-left-color: var(--diary) }
  .ev.crisis { border-left-color: var(--crisis) }
  .ev.deliberation { border-left-color: var(--delib) }
  .ev.error { border-left-color: var(--error) }
  .ev.theft { border-left-color: var(--error) }

  .ev .when { color: var(--dim); font-size: 10px }
  .ev .head {
    font-weight: 600; font-size: 12px;
    display: flex; align-items: center; gap: 6px;
  }
  .ev.scene .head { color: var(--scene) }
  .ev.diary .head { color: var(--diary) }
  .ev.crisis .head { color: var(--crisis) }
  .ev.deliberation .head { color: var(--delib) }
  .ev.error .head { color: var(--error) }

  .ev .thought {
    margin: 4px 0 2px;
    padding: 6px 8px;
    background: var(--thought-bg);
    border-radius: 4px;
    font-style: italic;
    color: var(--thought-fg);
    font-size: 12px;
    line-height: 1.5;
  }
  .ev .outcome {
    color: var(--dim);
    font-style: italic;
    font-size: 12px;
    margin: 3px 0;
  }
  .ev .xfer { color: var(--xfer); font-size: 11px; margin-top: 2px }
  .ev .gossip-line { color: var(--gossip); font-size: 11px; margin-top: 1px }

  .ev .dialogue {
    margin: 4px 0;
    max-height: 0;
    overflow: hidden;
    transition: max-height .25s ease;
  }
  .ev .dialogue.open { max-height: 2000px }
  .ev .dialogue .line { margin: 2px 0; font-size: 12px }
  .ev .dialogue .line b { color: var(--accent) }

  .ev .expand-btn {
    background: none; border: none; color: var(--dim); font-size: 11px;
    cursor: pointer; padding: 2px 0; font-family: inherit;
  }
  .ev .expand-btn:hover { color: var(--fg) }

  .ev .tag {
    display: inline-block;
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--tag-bg);
    color: var(--dim);
    margin-top: 3px;
  }
  .ev .delib-detail { font-size: 11px; color: var(--dim); margin-top: 4px }
  .ev .delib-detail span { color: var(--subtle) }
  .ev .drift-line { color: var(--warn-fg); font-size: 11px; margin-top: 2px }
  .plain { color: var(--text) }

  /* ---- agent tab ---- */

  .agent-tab-empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--dim);
    font-size: 12px;
  }
  .agent-tab-back {
    display: flex; align-items: center; gap: 6px;
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .agent-tab-back button {
    background: none; border: none; color: var(--dim); font-size: 16px;
    cursor: pointer; padding: 2px 6px; line-height: 1;
  }
  .agent-tab-back button:hover { color: var(--ctrl-fg-hover) }
  .agent-tab-back .agent-tab-title { font-size: 13px; font-weight: 600 }

  .card-body { padding: 4px 14px 14px; overflow-y: auto }
  .card-body section { margin-top: 12px }
  .card-body h3 {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); font-weight: 500; margin: 0 0 6px;
  }
  .card-body h3 .hint { text-transform: none; letter-spacing: 0; opacity: .6 }
  .card-body table { width: 100%; border-collapse: collapse; table-layout: fixed }
  .card-body td, .card-body th { padding: 2px 0; text-align: left; font-weight: 400; overflow: hidden; text-overflow: ellipsis }
  .card-body .num { text-align: right; font-variant-numeric: tabular-nums }
  .card-body .th th { color: var(--dim); font-size: 10px; text-align: right }
  .card-body .th th:first-child { text-align: left }
  .kv td:first-child { color: var(--dim); width: 68px }
  .kv td:last-child { width: auto }
  .values td:first-child { width: 90px }
  .values .bar { width: auto }
  .values .num { width: 38px }
  .bar { padding-right: 6px !important }
  .rels td:first-child, .rels th:first-child { width: auto }
  .rels td.num, .rels th:not(:first-child) { width: 44px }
  .track {
    display: block; position: relative; height: 5px; border-radius: 3px;
    background: var(--track-bg); overflow: hidden;
  }
  .fill { position: absolute; top: 0; bottom: 0 }
  .fill.pos { background: var(--fill-pos) }
  .fill.neg { background: var(--fill-neg) }
  .up { color: var(--up) } .down { color: var(--down) }
  .warn { color: var(--warn-fg) } .bad { color: var(--neg) }
  .card-body .dim { color: var(--dim) }
  .goals { margin: 0; padding-left: 16px }
  .goals li { margin: 2px 0 }
  .goals .constraint { color: var(--constraint) }
  .diary { margin-bottom: 10px }
  .diary-day { color: var(--dim); font-size: 10px }
  .diary p { margin: 2px 0 0; line-height: 1.5; color: var(--diary-text) }
  .card-sub { color: var(--dim); font-size: 11px; margin-top: 2px }

  /* ---- graph tab ---- */

  #tab-graph { align-items: stretch }
  #graph-canvas { width: 100%; flex: 1; display: block }

  /* ---- cognition stats ---- */

  .cog-stats { color: var(--dim); font-size: 11px; padding: 6px 16px; border-top: 1px solid var(--line); flex-shrink: 0; position: relative; cursor: default }
  .cog-calls { color: var(--cog-calls) }
  .cog-pending { color: var(--cog-pending) }
  .cog-dropped { color: var(--cog-dropped) }
  .cog-tokens { color: var(--cog-tokens) }
  .cog-cost { color: var(--cog-cost) }
  .cog-tooltip {
    display: none; position: absolute; bottom: 100%; left: 16px; margin-bottom: 6px;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 10px; font-size: 11px; color: var(--fg); white-space: nowrap;
    box-shadow: 0 4px 12px rgba(0,0,0,.3); pointer-events: none; z-index: 30;
  }
  .cog-info { color: var(--dim); opacity: .6; cursor: help; font-size: 12px }
  .cog-stats:hover .cog-tooltip { display: block }

  /* ---- venue card (floating) ---- */

  #venue-card {
    position: fixed; top: 16px; left: 16px; bottom: 16px; width: 340px;
    background: var(--venue-bg); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 12px 40px var(--venue-shadow); display: flex; flex-direction: column;
    z-index: 20; font-size: 12px; backdrop-filter: blur(6px);
  }
  #venue-card[hidden] { display: none }
  #venue-card .card-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  #venue-card .card-name { font-size: 16px; font-weight: 600 }
  #venue-card .card-x {
    background: none; border: none; color: var(--dim); font-size: 20px;
    line-height: 1; cursor: pointer; padding: 0 4px;
  }
  #venue-card .card-x:hover { color: var(--ctrl-fg-hover) }
  #venue-card .card-body { overflow-y: auto; padding: 4px 14px 14px }
  .occupants { width: 100%; border-collapse: collapse }
  .occupants tr { cursor: pointer }
  .occupants tr:hover { background: var(--venue-hover) }
  .occupants td { padding: 3px 0; white-space: nowrap }
</style>
<body>
  <div id="game-container">
    <div id="controls">
      <button data-zoom="-1" title="Zoom out">−</button>
      <button data-zoom="1" title="Zoom in">+</button>
      <span class="sep"></span>
      <button data-fit title="Fit the whole city">⤢</button>
      <span class="hint">drag to pan · scroll to zoom</span>
    </div>
    <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark mode">☀</button>
  </div>
  <div id="sidebar">
    <div class="sidebar-logo">
      <img src="/agentic-world-logo.png" alt="Agentic World">
      <span class="city-name" id="city-name"></span>
    </div>
    <div class="sidebar-header">
      <span class="clock" id="clock">--:--</span>
      <span class="date" id="date"></span>
      <span class="phase" id="phase"></span>
      <span class="conn off" id="conn">connecting...</span>
    </div>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="town">Town</button>
      <button class="tab-btn" data-tab="feed">Feed<span class="tab-badge" id="feed-badge" hidden></span></button>
      <button class="tab-btn" data-tab="agent">Agent</button>
      <button class="tab-btn" data-tab="graph">Graph</button>
    </div>
    <div class="tab-content">
      <div class="tab-pane active" id="tab-town">
        <div class="agents-list" id="agents-table"></div>
      </div>
      <div class="tab-pane" id="tab-feed">
        <div class="feed" id="feed"></div>
      </div>
      <div class="tab-pane" id="tab-agent">
        <div id="agent-detail">
          <div class="agent-tab-empty">Click an agent to inspect</div>
        </div>
      </div>
      <div class="tab-pane" id="tab-graph">
        <canvas id="graph-canvas"></canvas>
      </div>
    </div>
    <div class="cog-stats" id="cog"></div>
  </div>
  <script>
    const btn = document.getElementById('theme-toggle');
    const saved = localStorage.getItem('aw-theme');
    if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    btn.textContent = (saved === 'light') ? '☾' : '☀';
    btn.addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('aw-theme', 'dark');
        btn.textContent = '☀';
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
        localStorage.setItem('aw-theme', 'light');
        btn.textContent = '☾';
      }
    });
  </script>
  <script type="module" src="./main.ts"></script>
</body>
