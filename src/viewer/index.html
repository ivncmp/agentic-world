<!doctype html>
<meta charset="utf-8">
<title>Agentic World</title>
<link rel="icon" type="image/png" href="/favicon/favicon-96x96.png" sizes="96x96">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<link rel="shortcut icon" href="/favicon/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
<link rel="manifest" href="/favicon/site.webmanifest">
<meta name="theme-color" content="#0a0e17">
<style>
  :root {
    --bg: #0a0e17;
    --panel: #111827;
    --fg: #e5e7eb;
    --dim: #6b7280;
    --line: #1f2937;
    --accent: #7dd3fc;
    --scene: #e879f9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0 }
  html, body { height: 100%; overflow: hidden }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.5 'Inter', ui-sans-serif, system-ui, sans-serif;
    display: flex;
  }
  #game-container {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  #game-container canvas { display: block }

  #controls {
    position: absolute; left: 14px; bottom: 14px; z-index: 10;
    display: flex; gap: 6px; align-items: center;
    background: #0f172ad9; border: 1px solid var(--line); border-radius: 10px;
    padding: 6px; backdrop-filter: blur(6px);
  }
  #controls button {
    width: 30px; height: 30px; border-radius: 7px; cursor: pointer;
    background: #1e293b; color: var(--fg); border: 1px solid #2b3a52;
    font-size: 14px; line-height: 1; display: grid; place-items: center;
    font-family: inherit;
  }
  #controls button:hover { background: #334155; color: #fff }
  #controls .sep { width: 1px; height: 20px; background: var(--line) }
  #controls .hint { color: var(--dim); font-size: 11px; padding: 0 6px }

  #sidebar {
    width: 380px;
    flex-shrink: 0;
    background: var(--panel);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-logo {
    padding: 10px 16px 6px;
    border-bottom: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .sidebar-logo img { width: 220px; height: auto }
  .city-name {
    font-size: 13px; font-weight: 600; letter-spacing: .04em;
    color: var(--dim);
  }
  .sidebar-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 4px 12px;
  }
  .sidebar-header .clock { grid-row: 1 / 3 }
  .sidebar-header .date { grid-column: 2 }
  .sidebar-header .conn { grid-row: 1; grid-column: 3 }
  .sidebar-header .phase { grid-column: 2 / 4; white-space: nowrap }
  .clock { font-size: 24px; font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums }
  .date { color: var(--dim); font-size: 12px }
  .phase {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    background: rgba(125,211,252,0.1); color: var(--accent);
  }
  .conn {
    font-size: 11px; padding: 2px 8px; border-radius: 10px;
    margin-left: auto;
  }
  .conn.on { background: #14301f; color: #4ade80 }
  .conn.off { background: #3a1a1a; color: #f87171 }

  .agents-table {
    padding: 8px 12px;
    border-bottom: 1px solid var(--line);
    overflow-x: auto;
    flex-shrink: 0;
  }
  .agents-list { padding: 8px 12px; border-bottom: 1px solid var(--line); flex-shrink: 0 }
  .agents-list-header {
    font-size: 10px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--dim); font-weight: 500; padding: 0 0 4px;
  }
  .agent-row {
    padding: 6px 0; border-top: 1px solid var(--line); cursor: pointer;
  }
  .agent-row:hover { background: #1e293b; margin: 0 -12px; padding: 6px 12px }
  .agent-row-top {
    display: flex; align-items: center; gap: 6px;
  }
  .agent-row-name { font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .agent-row-money { font-size: 12px; font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap }
  .agent-row-bottom {
    display: flex; gap: 8px; padding-left: 30px; margin-top: 2px;
    font-size: 11px; color: var(--dim);
  }
  .agent-row-state { white-space: nowrap }
  .agent-row-where { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  .neg { color: #f87171 }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 6px; vertical-align: middle;
  }

  .feed-header {
    padding: 8px 16px;
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); font-weight: 500;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .feed {
    flex: 1; overflow-y: auto; padding: 8px 12px;
    display: flex; flex-direction: column-reverse; gap: 8px;
  }
  .ev { border-left: 2px solid var(--line); padding: 4px 0 4px 10px }
  .ev.scene { border-left-color: var(--scene) }
  .ev.diary { border-left-color: var(--accent) }
  .ev .when { color: var(--dim); font-size: 10px }
  .ev .head { font-weight: 600 }
  .ev.scene .head { color: var(--scene) }
  .ev.diary .head { color: var(--accent) }
  .line { margin: 3px 0 }
  .line b { color: var(--accent) }
  .outcome { color: var(--dim); font-style: italic; margin-top: 4px }
  .xfer { color: #fbbf24; margin-top: 2px }
  .plain { color: #cbd5e1 }
  .cog-stats { color: var(--dim); font-size: 11px; padding: 6px 16px; border-top: 1px solid var(--line); flex-shrink: 0 }
  .cog-calls { color: #4ade80 }
  .cog-pending { color: #fbbf24 }
  .cog-dropped { color: #f87171 }
  .cog-tokens { color: #94a3b8 }
  .cog-cost { color: #7dd3fc }

  /* ---- agent card ---- */

  #agent-card {
    position: fixed; top: 16px; left: 16px; bottom: 16px; width: 340px;
    background: #0f172afa; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 12px 40px #000a; display: flex; flex-direction: column;
    z-index: 20; font-size: 12px; backdrop-filter: blur(6px);
  }
  #agent-card[hidden] { display: none }
  .card-loading { padding: 16px; color: var(--dim) }
  .card-head {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .card-name { font-size: 16px; font-weight: 600 }
  .card-sub { color: var(--dim); font-size: 11px; margin-top: 2px }
  .card-x {
    background: none; border: none; color: var(--dim); font-size: 20px;
    line-height: 1; cursor: pointer; padding: 0 4px;
  }
  .card-x:hover { color: #fff }
  .card-body { overflow-y: auto; padding: 4px 14px 14px }
  .card-body section { margin-top: 14px }
  .card-body h3 {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--dim); font-weight: 500; margin: 0 0 6px;
  }
  .card-body h3 .hint { text-transform: none; letter-spacing: 0; opacity: .6 }
  .card-body table { width: 100%; border-collapse: collapse; table-layout: fixed }
  .card-body td, .card-body th { padding: 2px 0; text-align: left; font-weight: 400; overflow: hidden; text-overflow: ellipsis }
  .card-body .num { text-align: right; font-variant-numeric: tabular-nums }
  .card-body .th th { color: var(--dim); font-size: 10px; text-align: right }
  .card-body .th th:first-child { text-align: left }
  .kv td:first-child { color: var(--dim); width: 68px }
  .kv td:last-child { width: auto }
  .values td:first-child { width: 90px }
  .values .bar { width: auto }
  .values .num { width: 38px }
  .bar { padding-right: 6px !important }
  .rels td:first-child, .rels th:first-child { width: auto }
  .rels td.num, .rels th:not(:first-child) { width: 44px }
  .track {
    display: block; position: relative; height: 5px; border-radius: 3px;
    background: #1e293b; overflow: hidden;
  }
  .fill { position: absolute; top: 0; bottom: 0 }
  .fill.pos { background: #38bdf8 }
  .fill.neg { background: #fb7185 }
  .up { color: #4ade80 } .down { color: #f87171 }
  .warn { color: #fbbf24 } .bad { color: #f87171 }
  .card-body .dim { color: var(--dim) }
  .goals { margin: 0; padding-left: 16px }
  .goals li { margin: 2px 0 }
  .goals .constraint { color: #fbbf24 }
  .diary { margin-bottom: 10px }
  .diary-day { color: var(--dim); font-size: 10px }
  .diary p { margin: 2px 0 0; line-height: 1.5; color: #cbd5e1 }

  /* ---- venue card ---- */
  #venue-card {
    position: fixed; top: 16px; left: 16px; bottom: 16px; width: 340px;
    background: #0f172afa; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 12px 40px #000a; display: flex; flex-direction: column;
    z-index: 20; font-size: 12px; backdrop-filter: blur(6px);
  }
  #venue-card[hidden] { display: none }
  .occupants { width: 100%; border-collapse: collapse }
  .occupants tr { cursor: pointer }
  .occupants tr:hover { background: #1e293b }
  .occupants td { padding: 3px 0; white-space: nowrap }
</style>
<body>
  <div id="game-container">
    <div id="controls">
      <button data-zoom="-1" title="Zoom out">−</button>
      <button data-zoom="1" title="Zoom in">+</button>
      <span class="sep"></span>
      <button data-fit title="Fit the whole city">⤢</button>
      <span class="hint">drag to pan · scroll to zoom</span>
    </div>
  </div>
  <div id="sidebar">
    <div class="sidebar-logo">
      <img src="/agentic-world-logo.png" alt="Agentic World">
      <span class="city-name" id="city-name"></span>
    </div>
    <div class="sidebar-header">
      <span class="clock" id="clock">--:--</span>
      <span class="date" id="date"></span>
      <span class="phase" id="phase"></span>
      <span class="conn off" id="conn">connecting...</span>
    </div>
    <div class="agents-list" id="agents-table"></div>
    <div class="feed-header">live feed</div>
    <div class="feed" id="feed"></div>
    <div class="cog-stats" id="cog"></div>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
